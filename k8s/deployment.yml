---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: orderpdf-system

---
# ConfigMap for application settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderpdf-config
  namespace: orderpdf-system
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderpdf-api
  namespace: orderpdf-system

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderpdf-api
  namespace: orderpdf-system
  labels:
    app: orderpdf-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orderpdf-api
  template:
    metadata:
      labels:
        app: orderpdf-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: orderpdf-api
      containers:
      - name: orderpdf-api
        image: orderpdfapi:latest  # Update with your actual image registry
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8081
          protocol: TCP

        # Environment variables
        envFrom:
        - configMapRef:
            name: orderpdf-config

        # Resource limits and requests
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var
          mountPath: /var

      # Pod-level security context
      securityContext:
        fsGroup: 1000

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var
        emptyDir: {}

      # Node affinity (optional)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - orderpdf-api
              topologyKey: kubernetes.io/hostname

---
# Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: orderpdf-api
  namespace: orderpdf-system
  labels:
    app: orderpdf-api
spec:
  type: ClusterIP
  selector:
    app: orderpdf-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP

---
# Service (LoadBalancer - optional, for external access)
apiVersion: v1
kind: Service
metadata:
  name: orderpdf-api-lb
  namespace: orderpdf-system
  labels:
    app: orderpdf-api
spec:
  type: LoadBalancer
  selector:
    app: orderpdf-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orderpdf-api-hpa
  namespace: orderpdf-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orderpdf-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# Network Policy (optional - restricts ingress traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orderpdf-api-netpol
  namespace: orderpdf-system
spec:
  podSelector:
    matchLabels:
      app: orderpdf-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - namespaceSelector: {}
